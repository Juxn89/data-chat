<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="460" viewBox="0 0 1280 460" role="img" aria-labelledby="title desc">
<title id="title">data-chat</title>
<desc id="desc">Ask your sales spreadsheet in plain language and get the figure, a chart and how it was computed. The model never writes SQL: it returns a semantic query the server validates and compiles.</desc>
<style>
	.flow { stroke-dasharray: 6 7; animation: flow 1.6s linear infinite; }
	.pop { opacity: 0; animation: pop .5s ease-out forwards; }
	.glow { animation: glow 2.4s ease-in-out infinite alternate; }
	@keyframes flow { to { stroke-dashoffset: -26; } }
	@keyframes pop { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
	@keyframes glow { from { opacity: .55; } to { opacity: 1; } }
	@media (prefers-reduced-motion: reduce) { .flow, .glow { animation: none; } .pop { animation: none; opacity: 1; } }
</style>
<defs>
	<linearGradient id="brand" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fda4af"/><stop offset=".6" stop-color="#be123c"/><stop offset="1" stop-color="#f59e0b"/></linearGradient>
	<linearGradient id="metric" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fda4af"/><stop offset=".55" stop-color="#be123c"/><stop offset="1" stop-color="#f59e0b"/></linearGradient>
	<radialGradient id="orbRose"><stop offset="0" stop-color="#be123c" stop-opacity="0.14"/><stop offset="1" stop-color="#be123c" stop-opacity="0"/></radialGradient>
	<radialGradient id="orbAmber"><stop offset="0" stop-color="#f59e0b" stop-opacity="0.098"/><stop offset="1" stop-color="#f59e0b" stop-opacity="0"/></radialGradient>
	<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#be123c" fill-opacity="0.07"/></pattern>
	<clipPath id="frame"><rect width="1280" height="460" rx="28"/></clipPath>
	<filter id="soft" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.12"/></filter>
</defs>
<g clip-path="url(#frame)">
	<rect width="1280" height="460" fill="#fdf8f9"/>
	<rect width="1280" height="460" fill="url(#dots)"/>
	<circle cx="180" cy="40" r="340" fill="url(#orbRose)"/>
	<circle cx="1060" cy="470" r="360" fill="url(#orbAmber)"/>
</g>
<rect x=".5" y=".5" width="1279" height="459" rx="28" fill="none" stroke="#efdfe3"/>

<g transform="translate(72 70)">
	<rect width="236" height="30" rx="15" fill="#ffffff" stroke="#efdfe3"/>
	<circle cx="18" cy="15" r="4.5" fill="#fda4af" class="glow"/>
	<text x="31" y="20" font-family="'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="700" letter-spacing=".1em" fill="#475569">OPEN SOURCE · .NET 10 · MIT</text>
</g>
<text x="68" y="172" font-family="'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="66" font-weight="800" letter-spacing="-.03em" fill="#0f172a">data<tspan fill="url(#brand)">-chat</tspan></text>
<text x="72" y="230" font-family="'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600" fill="#0f172a">Ask your sales spreadsheet, in plain words.</text>
<text x="72" y="268" font-family="'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#475569">The figure, a chart and how it was computed.</text>
<text x="72" y="300" font-family="'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#475569">The model never writes SQL; the server does, read-only.</text>
<g transform="translate(72 352)"><rect width="164.4" height="32" rx="16" fill="#ffffff" stroke="#efdfe3"/><text x="82.2" y="21" text-anchor="middle" font-family="'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#0f172a">Claude Haiku 5.5</text></g><g transform="translate(244.4 352)"><rect width="206.4" height="32" rx="16" fill="#ffffff" stroke="#efdfe3"/><text x="103.2" y="21" text-anchor="middle" font-family="'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#0f172a">No SQL from the model</text></g><g transform="translate(458.8 352)"><rect width="147.60000000000002" height="32" rx="16" fill="#ffffff" stroke="#efdfe3"/><text x="73.80000000000001" y="21" text-anchor="middle" font-family="'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#0f172a">Read-only role</text></g><g transform="translate(614.4000000000001 352)"><rect width="172.8" height="32" rx="16" fill="#ffffff" stroke="#efdfe3"/><text x="86.4" y="21" text-anchor="middle" font-family="'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#0f172a">Checked summaries</text></g><g transform="translate(795.2 352)"><rect width="139.2" height="32" rx="16" fill="#ffffff" stroke="#efdfe3"/><text x="69.6" y="21" text-anchor="middle" font-family="'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#0f172a">Attacks 20/20</text></g>

<!-- The question -->
<g transform="translate(668 62)" filter="url(#soft)">
	<rect width="252" height="64" rx="16" fill="#be123c"/>
	<text x="16" y="27" font-family="'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#fff">¿Cuánto vendió cada sucursal</text>
	<text x="16" y="46" font-family="'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#fff">el último trimestre?</text>
</g>

<path d="M790 128 C 790 156, 796 160, 796 176" fill="none" stroke="#be123c" stroke-width="2.2" class="flow"/>

<!-- The semantic query the model returns -->
<g transform="translate(668 178)" filter="url(#soft)">
	<rect width="252" height="150" rx="18" fill="#ffffff" stroke="#efdfe3"/>
	<text x="18" y="30" font-family="'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="700" letter-spacing=".08em" fill="#be123c">SEMANTIC QUERY · NOT SQL</text>
	<text x="18" y="58" font-family="'Cascadia Code', 'SFMono-Regular', Consolas, Menlo, monospace" font-size="12.5" fill="#0f172a">metrics: [ventas]</text>
	<text x="18" y="80" font-family="'Cascadia Code', 'SFMono-Regular', Consolas, Menlo, monospace" font-size="12.5" fill="#0f172a">dimensions: [sucursal]</text>
	<text x="18" y="102" font-family="'Cascadia Code', 'SFMono-Regular', Consolas, Menlo, monospace" font-size="12.5" fill="#0f172a">period: LastQuarter</text>
	<g transform="translate(18 116)"><g class="pop" style="animation-delay:.5s">
		<rect width="132" height="22" rx="11" fill="#16a34a" fill-opacity=".14" stroke="#16a34a"/>
		<text x="66" y="15" text-anchor="middle" font-family="'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="700" fill="#16a34a">validated ✓</text>
	</g></g>
</g>

<path d="M920 254 C 962 254, 960 196, 1000 192" fill="none" stroke="#f59e0b" stroke-width="2.2" class="flow"/>

<!-- The answer: the server's SQL, run read-only, and the chart -->
<g transform="translate(998 92)" filter="url(#soft)">
	<rect width="216" height="214" rx="18" fill="#ffffff" stroke="#efdfe3"/>
	<text x="16" y="30" font-family="'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Centro: 12,078.19</text>
	<circle cx="196" cy="25" r="4.5" fill="#f59e0b" class="glow"/>
	<text x="16" y="52" font-family="'Cascadia Code', 'SFMono-Regular', Consolas, Menlo, monospace" font-size="10.5" fill="#475569">SELECT … WHERE date</text>
	<text x="16" y="68" font-family="'Cascadia Code', 'SFMono-Regular', Consolas, Menlo, monospace" font-size="10.5" fill="#475569">BETWEEN @p1 AND @p2</text>
	<g transform="translate(16 96)"><g class="pop" style="animation-delay:1.2s"><rect width="148" height="14" rx="4" fill="#be123c" fill-opacity="1"/></g></g><g transform="translate(16 118)"><g class="pop" style="animation-delay:1.3199999999999998s"><rect width="122" height="14" rx="4" fill="#be123c" fill-opacity="0.85"/></g></g><g transform="translate(16 140)"><g class="pop" style="animation-delay:1.44s"><rect width="98" height="14" rx="4" fill="#be123c" fill-opacity="0.7"/></g></g><g transform="translate(16 162)"><g class="pop" style="animation-delay:1.56s"><rect width="50" height="14" rx="4" fill="#be123c" fill-opacity="0.55"/></g></g>
	<text x="16" y="198" font-family="'Cascadia Code', 'SFMono-Regular', Consolas, Menlo, monospace" font-size="10.5" fill="#475569">read-only · 3 s · LIMIT</text>
</g>
</svg>
