name: AI review

# Reviewed by my own bot (github.com/Juxn89/claude-pr-review-bot): one review per PR, comments only,
# it can never approve or block. Without the ANTHROPIC_API_KEY secret it runs in dry-run mode.
on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: Juxn89/claude-pr-review-bot@v1
        with:
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          model: claude-haiku-5-5
          ignore-globs: "samples/**"
          project-context: >-
            "Ask your sales data" on .NET 10 / C# 14. Clean Architecture: Domain has no dependencies but NodaTime.
            The model never writes SQL: it returns a semantic query validated against the dataset's schema, and a
            compiler builds parameterized SQL from allow-listed identifiers, run by a read-only role. Periods are
            resolved by the server. No magic strings or numbers. Tabs for indentation.
